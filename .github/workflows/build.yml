name: Build EyeRAY

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current
          cache-provider: basic

      - name: Build
        run: gradle clean build --stacktrace

      - name: Upload EyeRAY JAR
        uses: actions/upload-artifact@v7
        with:
          name: EyeRAY-${{ github.sha }}
          path: build/libs/EyeRAY-*.jar
          if-no-files-found: error
