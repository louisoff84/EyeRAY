name: EyeRAY
version: '${version}'
main: fr.craftpick.eyeray.EyeRayPlugin
description: Universal client-side anti-XRay protection for Minecraft 1.8.8 through Paper 26.2.
author: louisoff84
website: https://github.com/louisoff84/EyeRAY

# api-version is intentionally omitted so the same JAR can load on 1.8.8.

commands:
  eyeray:
    description: Manage EyeRAY anti-XRay.
    usage: /eyeray <status|reload|toggle|rescan>
    aliases: [eray, antixray]
    permission: eyeray.admin

permissions:
  eyeray.admin:
    description: Allows management of EyeRAY.
    default: op
  eyeray.bypass:
    description: Bypasses EyeRAY obfuscation.
    default: false
